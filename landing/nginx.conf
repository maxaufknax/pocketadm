server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Docker's resolver, asked per request: a fixed upstream name would pin the
    # relay's address from when nginx started and break when it is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ =404;
    }

    # The push relay for the iPhone app (../push-relay).
    location /push/ {
        set $relay http://pocketadm-push:8080;
        rewrite ^/push/(.*)$ /$1 break;
        proxy_pass $relay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }
}
