# PocketADM — no-Mac iOS release pipeline (Codemagic)
# ---------------------------------------------------------------------------
# Builds the Capacitor client on a Codemagic macOS VM, signs it automatically
# with an App Store Connect API key (no Mac, no manual certificates), and ships
# it to TestFlight. Everything the build needs that only exists on macOS
# (CocoaPods, Xcode, the iOS project itself) is produced here at build time.
#
# ONE-TIME SETUP (in the Codemagic web UI — see client/APPSTORE.md):
#   1. Connect this Git repo.
#   2. Team settings → Integrations → App Store Connect → add your API key,
#      and name it exactly:  PocketADM ASC key   (matches `integrations` below).
#   3. Add a secure env var CERTIFICATE_PRIVATE_KEY_B64 (base64 of an RSA private
#      key) to the ios-release group — the distribution cert's private key, which
#      Apple's API can't hand out. See APPSTORE.md §Signing for how to generate it.
#   4. Start the "ios-release" workflow. First build → TestFlight.
# This workflow ships to TestFlight only (submit_to_testflight: true,
# submit_to_app_store: false) — a green build can NEVER disturb a pending App
# Review. Flip submit_to_app_store to true by hand only for the build you
# actually mean to release. See the publishing block at the bottom.
# ---------------------------------------------------------------------------

workflows:
  ios-release:
    name: PocketADM iOS (TestFlight + App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: client
    integrations:
      app_store_connect: PocketADM ASC key
    environment:
      # NOTE: no `ios_signing:` block here on purpose. That block only *fetches*
      # existing provisioning profiles and fails on a fresh app ("No matching
      # profiles found"). Instead the "Set up code signing" script below fetches
      # AND creates the distribution certificate + profile via --create.
      groups:
        - ios-release          # holds the secure var CERTIFICATE_PRIVATE_KEY_B64
      vars:
        BUNDLE_ID: "de.maxaufknax.pocketadm"
        TEAM_ID: "ZPF4QUFXXH"            # Apple Developer Team ID (App ID prefix)
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        MARKETING_VERSION: "1.0.1"       # public App Store version string
      node: 20
      # Pinned, not `latest`: a new Xcode is a deliberate change, not a surprise.
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci || npm install

      - name: Bundle the PWA into the native shell
        script: npm run sync-web        # copies ../web -> ./www (strips sw.js)

      - name: Create the iOS platform if it isn't committed yet
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Generate app icons & splash, and guarantee opaque icons
        script: |
          set -eo pipefail
          # Generate from assets/. Do NOT swallow failures: a missing or invalid
          # AppIcon is a top cause of App Store *processing* rejections (the
          # binary uploads fine, then Apple drops the build and emails you).
          npx @capacitor/assets generate --ios --assetPath assets
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          [ -d "$ICONSET" ] || { echo "!! $ICONSET missing — icon generation failed"; exit 1; }
          # App Store rejects any icon with an alpha channel (ITMS-90717).
          # @capacitor/assets can emit RGBA PNGs even from an RGB source, so
          # flatten every icon to opaque. sips has no direct "remove alpha", but
          # a round-trip through a format without alpha (BMP) drops it reliably.
          find "$ICONSET" -name '*.png' -print0 | while IFS= read -r -d '' png; do
            sips -s format bmp "$png" --out "/tmp/_icon.bmp" >/dev/null
            sips -s format png "/tmp/_icon.bmp" --out "$png" >/dev/null
          done
          # Sanity: the 1024 marketing icon must exist and now be opaque.
          MARKETING=$(find "$ICONSET" \( -name '*1024*' -o -name '*512@2x*' \) -name '*.png' | head -n1)
          [ -n "$MARKETING" ] || { echo "!! no 1024 marketing icon in $ICONSET"; exit 1; }
          echo "✓ icons generated + flattened to opaque; marketing icon: $(basename "$MARKETING")"
          sips -g hasAlpha "$MARKETING" || true

      - name: Apply native iOS configuration (Info.plist)
        script: bash scripts/ios-configure.sh

      - name: Install CocoaPods dependencies
        script: |
          set -eo pipefail
          cd ios/App && pod install
          # The QR scanner is a native plugin: if its pod is missing from the
          # binary, `Capacitor.registerPlugin` still hands the web layer a proxy
          # that simply rejects every call — so pairing-by-QR would silently be
          # dead in the shipped app and only App Review would find out. Assert
          # it linked, here, where the build can still fail loudly.
          grep -q "CapacitorBarcodeScanner" Podfile || {
            echo "!! CapacitorBarcodeScanner is not in the generated Podfile"
            echo "!! (npm dependency missing, or cap sync did not pick it up)"; exit 1; }
          grep -q "CapacitorBarcodeScanner" Podfile.lock || {
            echo "!! CapacitorBarcodeScanner did not install — see pod install output"; exit 1; }
          echo "✓ native barcode scanner pod linked"

      - name: Set the version and a monotonic build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$(date +%Y%m%d%H%M)"

      - name: Set up code signing (create cert + profile from key)
        script: |
          set -eo pipefail
          # Apple's API can create/return a distribution certificate but NEVER its
          # private key — that has to be supplied. Without it fetch-signing-files
          # fails with "Cannot save Signing Certificates without certificate
          # private key" and produces no cert AND no profile. Supply a persistent
          # key stored ONCE as a base64 secure env var in Codemagic (see
          # client/APPSTORE.md §Signing). Reusing the same key every build means
          # no new certificate is created (Apple caps distribution certs).
          if [ -z "${CERTIFICATE_PRIVATE_KEY_B64:-}" ]; then
            echo "!! CERTIFICATE_PRIVATE_KEY_B64 is not set. Add it as a secure env"
            echo "!! variable in Codemagic (ios-release group) — see APPSTORE.md §Signing."
            exit 1
          fi
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -d -A -out /tmp/cert_key.pem

          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          # use-profiles writes the fetched profile onto BOTH the App target's
          # Debug/Release build configs (manual style, team, specifier, Apple
          # Distribution identity) AND generates export_options.plist. Once the
          # cert + profile actually exist (they do now, thanks to the key above),
          # this fully configures signing — no manual xcodeproj patching needed.
          xcode-project use-profiles

      - name: Verify minimum iOS version is 15.0 (final gate before xcodebuild)
        script: |
          set -eo pipefail
          # ios-configure.sh pins the project to iOS 15.0, but it runs *before*
          # pod install, agvtool and use-profiles. Those later steps rewrite the
          # project, so re-assert here — the very last step before compiling —
          # that no step silently reintroduced iOS 13/14. A below-floor build
          # ships fine and is only rejected afterwards (ITMS-90068):
          # cheap to catch now, expensive to catch in App Store Connect.
          PROJ="ios/App/App.xcodeproj/project.pbxproj"
          PLIST="ios/App/App/Info.plist"
          if grep -nE 'IPHONEOS_DEPLOYMENT_TARGET = 1[0-4]\.' "$PROJ"; then
            echo "!! IPHONEOS_DEPLOYMENT_TARGET below 15.0 reappeared in $PROJ"
            echo "!! (did pod install / agvtool / use-profiles reset the template value?)"
            exit 1
          fi
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' "$PROJ" || {
            echo "!! IPHONEOS_DEPLOYMENT_TARGET = 15.0 not found in $PROJ"; exit 1; }
          M=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST" 2>/dev/null || true)
          [ "$M" = "15.0" ] || { echo "!! Info.plist MinimumOSVersion is '${M:-<missing>}', expected 15.0"; exit 1; }
          echo "✓ minimum iOS version is 15.0 in both the project and Info.plist"

      - name: Build the signed IPA
        script: |
          set +e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
          status=$?
          if [ $status -ne 0 ]; then
            echo "═══════ build-ipa failed (exit $status) — real xcodebuild error below ═══════"
            log=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n1)
            if [ -n "$log" ]; then
              echo ">> log file: $log"
              echo "───────── error / signing lines ─────────"
              grep -nE "error:|fatal error|The following build commands failed|Signing for|requires a provisioning|No profile|no matching|certificate|does not support|deployment target|Undefined symbol|linker command failed|PhaseScriptExecution" "$log" | tail -n 100
              echo "───────── last 200 log lines ─────────"
              tail -n 200 "$log"
            else
              echo "!! no xcodebuild log found under /tmp/xcodebuild_logs"
            fi
            exit $status
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # TestFlight only. Flip to true ONLY on the build you actually mean to
        # release, and bump MARKETING_VERSION with it.
        #
        # Why it is false while a version sits in App Review: a build and an App
        # Store version are separate records. The submitted version has its build
        # pinned, and a fresh upload does not attach itself to it -- so uploading
        # to TestFlight mid-review is safe and leaves the queue position alone.
        # `submit_to_app_store: true` is what breaks that: it creates a *second*
        # submission for the same MARKETING_VERSION, which either errors out or
        # pulls the pending build back out of review. Build numbers come from
        # `date +%Y%m%d%H%M`, so parallel TestFlight builds never collide with
        # the one under review -- only this flag does.
        submit_to_app_store: false

  # ---------------------------------------------------------------------------
  # NATIVE SWIFTUI PREVIEW (experiment/swift-native)
  #
  # A second, completely separate app: bundle id de.maxaufknax.pocketadm.native,
  # its own App Store Connect record, its own Xcode project in client-swift/.
  # It shares exactly two things with `ios-release` above — the Apple account's
  # ASC API key and the distribution certificate's private key — because both
  # are per-account resources that Apple rate-limits, not per-app ones.
  #
  # Nothing here can disturb the App Review that de.maxaufknax.pocketadm is
  # sitting in: different app record, and `submit_to_app_store` is false.
  # ---------------------------------------------------------------------------

  # Compiles the SwiftUI app for the simulator. No Apple account, no signing,
  # no upload — so it runs green before any of the Apple-portal setup exists,
  # and a syntax error costs one cheap build instead of a signing round trip.
  ios-native-check:
    name: Native preview · build check (no Apple account)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: client-swift
    environment:
      # Pinned, not `latest`: a new Xcode is a deliberate change, not a surprise.
      xcode: 26.6
      vars:
        XCODE_SCHEME: "PocketADMNative"
        XCODE_PROJECT: "PocketADMNative.xcodeproj"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        # Scoped to the experiment branch. Unscoped, every push to main would
        # start a macOS build of an app that only exists on this branch.
        - pattern: "experiment/*"
          include: true
          source: true
    scripts:
      - name: Swift syntax sanity check
        script: |
          # Runs in seconds and catches an unbalanced brace before it burns
          # half an Xcode build.
          python3 tools/swift-sanity.py App

      - name: Provide XcodeGen
        script: |
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Write a placeholder build number
        script: |
          # project.yml references this file; without it xcodegen has nothing to
          # attach. The real number is only set in the TestFlight workflow.
          mkdir -p Config
          printf 'CURRENT_PROJECT_VERSION = %s\nPRODUCT_BUNDLE_IDENTIFIER = de.maxaufknax.pocketadm\n' \
            "${BUILD_NUMBER:-1}" > Config/Build.xcconfig

      - name: Generate the Xcode project
        script: |
          set -eo pipefail
          xcodegen generate
          test -d "$XCODE_PROJECT"

      - name: Ensure the Metal toolchain is available
        script: |
          set -uo pipefail
          # SwiftTerm ships Apple/Metal/Shaders.metal as an unconditional
          # package resource, so the `metal` compiler has to exist even though
          # the Metal renderer is only an optional fast path at runtime (there
          # is no build flag to opt out; the disableMetalRenderer* calls are
          # runtime fallbacks). Since Xcode 16.3 the Metal toolchain is a
          # separate downloadable component that is NOT on the CI image, and
          # without it the shader build dies with:
          #   cannot execute tool 'metal' due to missing Metal Toolchain
          if xcrun metal --version >/dev/null 2>&1; then
            echo "✓ Metal toolchain already present"
          else
            echo "Downloading the Metal toolchain (several minutes, once per VM)…"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20 \
              || sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20
            if xcrun metal --version >/dev/null 2>&1; then
              echo "✓ Metal toolchain installed: $(xcrun metal --version 2>&1 | head -1)"
            else
              echo "!! The Metal toolchain is still unavailable."
              echo "!! Fallback if this keeps failing: pin SwiftTerm to 1.11.2 in"
              echo "!! client-swift/project.yml — the last release before the Metal"
              echo "!! backend landed in 1.12.0."
              exit 1
            fi
          fi

      - name: Build for the simulator
        script: |
          set -eo pipefail
          mkdir -p build/logs
          FORMATTER=cat
          command -v xcbeautify >/dev/null && FORMATTER=xcbeautify
          # -skipPackagePluginValidation / -skipMacroValidation: SwiftTerm ships
          # a build-tool plugin. Xcode refuses to run an unvalidated plugin in a
          # non-interactive build and there is no prompt to accept it in CI, so
          # without these the build dies at "package plugin
          # SwiftTermBuildInfoPlugin ... is disabled".
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/logs/xcodebuild.log | $FORMATTER

      - name: Summarise warnings
        script: |
          # Reports only; never fails the build.
          grep -E "warning:" build/logs/xcodebuild.log \
            | sed 's|/Users/builder/clone/||' | sort -u | head -60 \
            || echo "No warnings."
    artifacts:
      - build/logs/*.log

  # Signs the native preview and uploads it to TestFlight under the NEW bundle id.
  ios-native-preview:
    name: Native preview · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: client-swift
    integrations:
      # The same key as `ios-release`, on purpose: an App Store Connect API key
      # belongs to the Apple *account*, not to an app. There is exactly one on
      # this account and it is named "PocketADM ASC key". A second integration
      # would be the same key twice, and renaming this one would break the
      # release pipeline above. If Codemagic reports "integration does not
      # exist", the name here is misspelled — do not create another key.
      app_store_connect: PocketADM ASC key
    environment:
      # Deliberately no `ios_signing:` block. That block only *fetches*
      # already-existing provisioning profiles and fails on a brand-new app id
      # with "No matching profiles found". The signing step below instead
      # creates the certificate and profile with `fetch-signing-files --create`.
      groups:
        # Reuses the existing group purely for CERTIFICATE_PRIVATE_KEY_B64.
        # Apple caps distribution certificates per account, so both apps must
        # sign with the same key rather than each minting its own.
        - ios-release
      vars:
        BUNDLE_ID: "de.maxaufknax.pocketadm.native"
        XCODE_SCHEME: "PocketADMNative"
        XCODE_PROJECT: "PocketADMNative.xcodeproj"
      # Pinned, not `latest`: a new Xcode is a deliberate change, not a surprise.
      xcode: 26.6
    triggering:
      events:
        - tag
      tag_patterns:
        # Its own tag namespace, so tagging the native preview can never kick
        # off the release pipeline and vice versa.
        - pattern: "native-v*"
          include: true
    scripts:
      - name: Check prerequisites
        script: |
          set -eo pipefail
          if [ -z "${CERTIFICATE_PRIVATE_KEY_B64:-}" ] && [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "!! Neither CERTIFICATE_PRIVATE_KEY_B64 nor CERTIFICATE_PRIVATE_KEY is set."
            echo "!! Codemagic -> Environment variables -> group 'ios-release'."
            exit 1
          fi

          # Informational only: without an App Store Connect app record the
          # build signs fine and then dies at the very last step with
          # "Cannot determine the Apple ID from Bundle ID". Better to say so now.
          if app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" \
               > /tmp/asc_apps.json 2>/tmp/asc_err.txt; then
            if grep -q "$BUNDLE_ID" /tmp/asc_apps.json; then
              echo "✓ App Store Connect record found for $BUNDLE_ID."
            else
              echo "!! No App Store Connect app with bundle id $BUNDLE_ID."
              echo "!!"
              echo "!! The build will produce a correctly signed IPA, but the"
              echo "!! upload at the end will fail."
              echo "!!"
              echo "!! Fix (one time, by hand — the API cannot create this):"
              echo "!!   App Store Connect -> Apps -> + -> New App"
              echo "!!   Platform iOS, Name 'PocketADM Native', Language English,"
              echo "!!   Bundle ID $BUNDLE_ID, SKU pocketadm-native"
              echo "!! See client-swift/NOTES.md."
            fi
          else
            # A check that silently fails is worse than no check — you rely on
            # a result that never came.
            echo "!! Could not query the app record; this pre-flight check is skipped:"
            sed 's/^/!!   /' /tmp/asc_err.txt 2>/dev/null | head -5
          fi

      - name: Provide XcodeGen
        script: |
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Determine the build number
        script: |
          set -e
          # A fresh app record starts at zero, so a timestamp is both unique and
          # monotonic. It shares no numbering with the Capacitor app.
          NEW_BUILD="$(date +%Y%m%d%H%M)"
          echo "Build number: $NEW_BUILD"
          echo "NATIVE_BUILD_NUMBER=$NEW_BUILD" >> "$CM_ENV"

      - name: Write the build number into an xcconfig
        script: |
          set -e
          mkdir -p Config
          cat > Config/Build.xcconfig <<XCCONFIG
          CURRENT_PROJECT_VERSION = ${NATIVE_BUILD_NUMBER}
          PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}
          XCCONFIG
          cat Config/Build.xcconfig

      - name: Generate the Xcode project
        script: |
          set -eo pipefail
          xcodegen generate
          test -d "$XCODE_PROJECT"

      - name: Verify the build number reaches the target
        script: |
          set -eo pipefail
          # Proves Config/Build.xcconfig is actually attached. If it is not,
          # CFBundleVersion stays at 1 and the *second* upload is rejected for a
          # duplicate build number — long after this build reported success.
          set +e
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release -showBuildSettings > /tmp/buildsettings.txt 2>/dev/null
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "!! Build settings unreadable — check skipped."
          else
            BUILD_NO=$(awk -F' = ' '/ CURRENT_PROJECT_VERSION = /{print $2; exit}' /tmp/buildsettings.txt)
            echo "CURRENT_PROJECT_VERSION = ${BUILD_NO:-<empty>}"
            if [ "${BUILD_NO:-1}" = "1" ]; then
              echo "!! The xcconfig is not attached to the target — in project.yml"
              echo "!! this belongs under 'configFiles:', not under"
              echo "!! 'settings.configs.<name>.xcconfig'."
              exit 1
            fi
          fi

      - name: Set up code signing (creates the app id, certificate and profile)
        script: |
          set -eo pipefail
          # Apple's API can create a distribution certificate but NEVER hands
          # out its private key — that has to come from here. Without it this
          # step fails with "Cannot save Signing Certificates without
          # certificate private key" and creates neither cert nor profile.
          key_raw="${CERTIFICATE_PRIVATE_KEY:-${CERTIFICATE_PRIVATE_KEY_B64:-}}"
          if printf '%s' "$key_raw" | grep -q -- "-----BEGIN"; then
            printf '%s\n' "$key_raw" > /tmp/cert_key.pem
          else
            printf '%s' "$key_raw" | tr -d '[:space:]' \
              | openssl base64 -d -A -out /tmp/cert_key.pem
          fi

          keychain initialize
          # --create also REGISTERS the bundle id in the Developer Portal if it
          # does not exist yet, which is why the new app id needs no manual
          # click there. It cannot create the App Store Connect app record —
          # that one is genuinely manual, see the prerequisites step.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          # Must run after xcodegen — there is no project to patch before that.
          xcode-project use-profiles

      - name: Ensure the Metal toolchain is available
        script: |
          set -uo pipefail
          # SwiftTerm ships Apple/Metal/Shaders.metal as an unconditional
          # package resource, so the `metal` compiler has to exist even though
          # the Metal renderer is only an optional fast path at runtime (there
          # is no build flag to opt out; the disableMetalRenderer* calls are
          # runtime fallbacks). Since Xcode 16.3 the Metal toolchain is a
          # separate downloadable component that is NOT on the CI image, and
          # without it the shader build dies with:
          #   cannot execute tool 'metal' due to missing Metal Toolchain
          if xcrun metal --version >/dev/null 2>&1; then
            echo "✓ Metal toolchain already present"
          else
            echo "Downloading the Metal toolchain (several minutes, once per VM)…"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20 \
              || sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20
            if xcrun metal --version >/dev/null 2>&1; then
              echo "✓ Metal toolchain installed: $(xcrun metal --version 2>&1 | head -1)"
            else
              echo "!! The Metal toolchain is still unavailable."
              echo "!! Fallback if this keeps failing: pin SwiftTerm to 1.11.2 in"
              echo "!! client-swift/project.yml — the last release before the Metal"
              echo "!! backend landed in 1.12.0."
              exit 1
            fi
          fi

      - name: Build the signed IPA
        script: |
          # No `set -e`: on failure the log has to be surfaced first. build-ipa
          # otherwise reports only "exited with status 1" and the real error
          # stays in a file nobody sees.
          set +e
          # NOT `--xcargs` — xcode-project has no such option; it splits the
          # passthrough into --archive-xcargs and --export-xcargs. Only the
          # archive compiles the package, so only it needs the skip flags.
          #
          # COMPILER_INDEX_STORE_ENABLE=NO is the option's own default and has
          # to be repeated here, because passing a value replaces it rather
          # than adding to it.
          #
          # The `=` form is deliberate: argparse otherwise mistakes a value
          # beginning with "-" for another option, which is exactly how the
          # previous attempt turned into "unrecognized arguments".
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs="COMPILER_INDEX_STORE_ENABLE=NO -skipPackagePluginValidation -skipMacroValidation"
          status=$?
          if [ $status -ne 0 ]; then
            echo "═══════ build-ipa failed (exit $status) — Xcode error below ═══════"
            log=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n1)
            if [ -n "$log" ]; then
              echo ">> log file: $log"
              echo "───────── error and signing lines ─────────"
              grep -nE "error:|fatal error|The following build commands failed|Signing for|requires a provisioning|No profile|no matching|certificate|does not support|deployment target|Undefined symbol|linker command failed|plugin" "$log" | tail -n 100
              echo "───────── last 200 log lines ─────────"
              tail -n 200 "$log"
            else
              echo "!! no xcodebuild log under /tmp/xcodebuild_logs"
            fi
            exit $status
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration

        # Upload only — do not submit for beta review.
        #
        # `submit_to_testflight: true` requests **external** tester review,
        # which demands full test information (feedback email, contact with
        # phone number) and fails without it. Internal testers need none of
        # that: they get every processed build automatically. For installing on
        # your own iPhone, that is the right path.
        submit_to_testflight: false

        # MUST stay false. This is the only flag in this file that could touch
        # the pending App Review — and even then only for its own app record.
        # There is no reason to ever set it here: this is a preview build.
        submit_to_app_store: false
      email:
        recipients:
          - maximilian.elias.paasch@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # PocketADM 2.0+ — the native app as THE App Store app (de.maxaufknax.pocketadm,
  # app 6790731797), replacing the Capacitor build above.
  #
  # Start it by hand (Codemagic → PocketADM → Start new build → ios-native-release,
  # branch main). It builds and signs the IPA, photographs the app in the
  # simulator against the demo server and lays the shots into store images,
  # uploads the build, and then gets the App Store version ready: version string,
  # build, What's New (en-US, de-DE), review notes with the demo account, and the
  # new screenshots — for the version being prepared only; the live listing keeps
  # its images until this version is approved.
  #
  # It NEVER submits. The last log line is the link to the version page in App
  # Store Connect; pressing "Submit for Review" there is a person's decision.
  # ---------------------------------------------------------------------------
  ios-native-release:
    name: PocketADM 2 · App Store (prepare, never submit)
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: client-swift
    integrations:
      app_store_connect: PocketADM ASC key
    environment:
      groups:
        - ios-release          # CERTIFICATE_PRIVATE_KEY_B64, shared on purpose (see above)
      vars:
        BUNDLE_ID: "de.maxaufknax.pocketadm"
        XCODE_SCHEME: "PocketADMNative"
        XCODE_PROJECT: "PocketADMNative.xcodeproj"
        APP_VERSION: "2.0.0"   # must equal MARKETING_VERSION in project.yml
        SIM_DEVICE: "iPhone 17 Pro Max"
      xcode: 26.6
    scripts:
      - name: Check prerequisites
        script: |
          set -eo pipefail
          if [ -z "${CERTIFICATE_PRIVATE_KEY_B64:-}" ] && [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "!! CERTIFICATE_PRIVATE_KEY_B64 is not set (group ios-release)."; exit 1
          fi
          MV=$(awk -F'"' '/MARKETING_VERSION:/{print $2; exit}' project.yml)
          if [ "$MV" != "$APP_VERSION" ]; then
            echo "!! project.yml says MARKETING_VERSION $MV, this workflow releases $APP_VERSION."
            echo "!! A build only attaches to the App Store version with the same number."
            exit 1
          fi
          curl -fsS https://demo.pocketadm.com/api/info | grep -q '"demo":true' \
            || { echo "!! demo.pocketadm.com is not answering as a demo — App Review depends on it."; exit 1; }
          echo "✓ $BUNDLE_ID $APP_VERSION, signing key present, demo server up"

      - name: Provide XcodeGen
        script: |
          which xcodegen || brew install xcodegen
          xcodegen --version

      - name: Determine the build number
        script: |
          set -e
          # Timestamps keep rising past every Capacitor build of this app record.
          NEW_BUILD="$(date +%Y%m%d%H%M)"
          echo "Build number: $NEW_BUILD"
          echo "NATIVE_BUILD_NUMBER=$NEW_BUILD" >> "$CM_ENV"

      - name: Write the build configuration
        script: |
          set -e
          mkdir -p Config
          cat > Config/Build.xcconfig <<XCCONFIG
          CURRENT_PROJECT_VERSION = ${NATIVE_BUILD_NUMBER}
          PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}
          XCCONFIG
          cat Config/Build.xcconfig

      - name: Generate the Xcode project
        script: |
          set -eo pipefail
          xcodegen generate
          test -d "$XCODE_PROJECT"

      - name: Verify bundle id, version and build number reach the target
        script: |
          set -eo pipefail
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release -showBuildSettings > /tmp/buildsettings.txt 2>/dev/null
          get() { awk -F' = ' "/ $1 = /{print \$2; exit}" /tmp/buildsettings.txt; }
          echo "PRODUCT_BUNDLE_IDENTIFIER = $(get PRODUCT_BUNDLE_IDENTIFIER)"
          echo "MARKETING_VERSION = $(get MARKETING_VERSION)"
          echo "CURRENT_PROJECT_VERSION = $(get CURRENT_PROJECT_VERSION)"
          [ "$(get PRODUCT_BUNDLE_IDENTIFIER)" = "$BUNDLE_ID" ] || { echo "!! wrong bundle id"; exit 1; }
          [ "$(get MARKETING_VERSION)" = "$APP_VERSION" ] || { echo "!! wrong version"; exit 1; }
          [ "$(get CURRENT_PROJECT_VERSION)" = "$NATIVE_BUILD_NUMBER" ] || { echo "!! xcconfig not attached"; exit 1; }

      - name: Set up code signing
        script: |
          set -eo pipefail
          key_raw="${CERTIFICATE_PRIVATE_KEY:-${CERTIFICATE_PRIVATE_KEY_B64:-}}"
          if printf '%s' "$key_raw" | grep -q -- "-----BEGIN"; then
            printf '%s\n' "$key_raw" > /tmp/cert_key.pem
          else
            printf '%s' "$key_raw" | tr -d '[:space:]' | openssl base64 -d -A -out /tmp/cert_key.pem
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --certificate-key @file:/tmp/cert_key.pem --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Ensure the Metal toolchain is available
        script: |
          set -uo pipefail
          # SwiftTerm compiles a Metal shader unconditionally (see ios-native-check).
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20 \
              || sudo xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -20
          fi
          xcrun metal --version >/dev/null 2>&1 || { echo "!! no Metal toolchain"; exit 1; }

      - name: Build the signed IPA
        script: |
          set +e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs="COMPILER_INDEX_STORE_ENABLE=NO -skipPackagePluginValidation -skipMacroValidation"
          status=$?
          if [ $status -ne 0 ]; then
            log=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n1)
            [ -n "$log" ] && grep -nE "error:|fatal error|failed|Signing for|provisioning" "$log" | tail -n 80
            exit $status
          fi

      - name: Check the IPA before it goes anywhere
        script: |
          set -eo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          rm -rf /tmp/ipa && mkdir /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          APP=$(ls -d /tmp/ipa/Payload/*.app)
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Info.plist"; }
          [ "$(plist CFBundleIdentifier)" = "$BUNDLE_ID" ] || { echo "!! bundle id"; exit 1; }
          [ "$(plist CFBundleShortVersionString)" = "$APP_VERSION" ] || { echo "!! version"; exit 1; }
          [ "$(plist ITSAppUsesNonExemptEncryption)" = "false" ] || { echo "!! export compliance key"; exit 1; }
          plist NSCameraUsageDescription >/dev/null
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "!! PrivacyInfo.xcprivacy is not in the app"; exit 1; }
          echo "✓ $(plist CFBundleIdentifier) $(plist CFBundleShortVersionString) ($(plist CFBundleVersion)), minimum iOS $(plist MinimumOSVersion), privacy manifest present"

      - name: Photograph the app for the store
        script: |
          set -eo pipefail
          # A simulator build of the same sources, signed by nobody.
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build | tail -5
          SIMAPP=$(ls -d build/sim/Build/Products/Debug-iphonesimulator/*.app | head -1)
          UDID=$(xcrun simctl create pocketadm-shots "$SIM_DEVICE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" "$SIMAPP"
          mkdir -p build/shots/raw
          # -PocketADMScreenshotTab signs in to the demo server and opens that tab
          for tab in dashboard assistant containers terminal more; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" -PocketADMScreenshotTab "$tab"
            sleep 15
            xcrun simctl io "$UDID" screenshot "build/shots/raw/raw-$tab.png"
          done
          xcrun simctl shutdown "$UDID" || true
          python3 -m venv /tmp/shots-venv
          /tmp/shots-venv/bin/pip install --quiet pillow
          /tmp/shots-venv/bin/python tools/store-shots.py build/shots/raw build/shots/store

      - name: Upload the build to App Store Connect
        script: |
          set -eo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          # Upload only: neither TestFlight beta review nor App Store review.
          app-store-connect publish --path "$IPA"

      - name: Get the App Store version ready (never submits)
        script: |
          set -eo pipefail
          python3 -m venv /tmp/asc-venv
          /tmp/asc-venv/bin/pip install --quiet pyjwt cryptography
          /tmp/asc-venv/bin/python tools/asc_release.py \
            --bundle-id "$BUNDLE_ID" --version "$APP_VERSION" \
            --build-number "$NATIVE_BUILD_NUMBER" --texts AppStore \
            --screenshots build/shots/store --wait-minutes 75

    artifacts:
      - build/ios/ipa/*.ipa
      - build/shots/raw/*.png
      - build/shots/store/**/*.png
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - maximilian.elias.paasch@gmail.com
        notify:
          success: true
          failure: true
