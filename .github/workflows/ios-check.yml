name: ios-check

# Compiles the native iPhone app for the simulator on every push that touches
# it — no signing, no Apple account, nothing uploaded. The App Store build
# itself runs on Codemagic (codemagic.yaml, ios-native-release); this is the
# quick "does it compile" gate, with the first compiler errors as annotations
# on the commit.

on:
  push:
    branches: [main, "release-*"]
    paths: ["client-swift/**", ".github/workflows/ios-check.yml"]
  pull_request:
    paths: ["client-swift/**"]
  workflow_dispatch:

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client-swift
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen >/dev/null
          mkdir -p Config
          printf 'CURRENT_PROJECT_VERSION = 1\nPRODUCT_BUNDLE_IDENTIFIER = de.maxaufknax.pocketadm\n' > Config/Build.xcconfig
          xcodegen generate

      - name: Make sure the Metal toolchain is there
        run: |
          # SwiftTerm compiles a Metal shader (see codemagic.yaml)
          xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain | tail -5

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project PocketADMNative.xcodeproj -scheme PocketADMNative \
            -destination "generic/platform=iOS Simulator" -configuration Debug \
            -derivedDataPath build/dd \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || { tail -40 build.log; exit 1; }
          grep -E "BUILD SUCCEEDED" build.log

      - name: Open every screen on a simulator and look for crashes
        if: success() && github.event_name == 'push'
        run: |
          set -u
          APP=$(ls -d build/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BUNDLE=de.maxaufknax.pocketadm
          DEVICE=$(xcrun simctl list devicetypes | grep -oE "iPhone [0-9]+ Pro" | sort -V | tail -1)
          UDID=$(xcrun simctl create smoke "$DEVICE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          crashes=0
          while read -r name tab route; do
            [ -z "$name" ] && continue
            args=(-PocketADMScreenshotTab "$tab")
            [ -n "${route:-}" ] && args+=(-PocketADMScreenshotRoute "$route")
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE" "${args[@]}" > /dev/null
            sleep 14
            if xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$BUNDLE"; then
              echo "✓ $name"
            else
              echo "::error title=Crash on $name::the app is not running 14 s after opening $tab ${route:-}"
              crashes=$((crashes + 1))
            fi
            xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null 2>&1 || true
          done <<'SCREENS'
          dashboard dashboard
          assistant assistant
          containers containers
          terminal terminal
          session terminal session
          more more
          watch more alerts
          files more files
          activity more activity
          health more checks
          updates more updates
          ai more ai
          SCREENS
          for report in $(find ~/Library/Logs/DiagnosticReports -name 'PocketADM*' 2>/dev/null | head -3); do
            summary=$(grep -m1 -E '"exception"|Exception Type' "$report" | head -c 300)
            frames=$(grep -m6 -E 'PocketADM' "$report" | tr '\n' ' ' | head -c 700)
            echo "::error title=Crash report::$summary $frames"
          done
          [ "$crashes" -eq 0 ]

      - name: Compiler errors (1-10)
        if: failure()
        run: |
          grep -E "^/.+:[0-9]+:[0-9]+: error: " build.log | sort -u > errors.txt || true
          wc -l < errors.txt
          sed -n '1,10p' errors.txt | sed -E 's#^.*/client-swift/(.+):([0-9]+):([0-9]+): error: (.*)$#::error file=client-swift/\1,line=\2,col=\3::\4#'

      - name: Compiler errors (11-20)
        if: failure()
        run: |
          sed -n '11,20p' errors.txt | sed -E 's#^.*/client-swift/(.+):([0-9]+):([0-9]+): error: (.*)$#::error file=client-swift/\1,line=\2,col=\3::\4#'

      - name: Compiler errors (21-30)
        if: failure()
        run: |
          sed -n '21,30p' errors.txt | sed -E 's#^.*/client-swift/(.+):([0-9]+):([0-9]+): error: (.*)$#::error file=client-swift/\1,line=\2,col=\3::\4#'
