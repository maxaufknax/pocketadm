[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
# Put the repo root on sys.path so `from server import ...` resolves under a
# bare `pytest` invocation too (CI runs `pytest`, not `python -m pytest`, and
# only the latter adds the CWD automatically). Without this, collection fails
# with ModuleNotFoundError: No module named 'server'.
pythonpath = .
# Third-party (FastAPI/Starlette) deprecation warnings are noise we don't own;
# keep them visible but never let them fail the suite.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
