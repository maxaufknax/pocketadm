<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PocketADM app preview</title>
<!--
  The App Store preview, drawn frame by frame. Nothing here animates on its
  own: render.mjs calls window.renderFrame(t) for every frame and photographs
  the page, so a frame is a pure function of its time.

  ?lang=en|de   captions (the app itself is English)
  ?orient=portrait|landscape   886 x 1920 or 1920 x 886
  ?t=12.3       show one moment (for looking at a frame in a browser)

  UI icons: Lucide (ISC, https://lucide.dev). Brand marks: Simple Icons (CC0),
  the same files the app ships.
-->
<style>
@font-face { font-family: "PADisplay"; src: url("../fonts/InterDisplay-Black.ttf"); font-weight: 900; }
@font-face { font-family: "PASemi"; src: url("../fonts/Inter-SemiBold.ttf"); font-weight: 600; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #000; }
body { font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11" 1; }
#stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #000; }

/* ---------- background ---------- */
.blob { position: absolute; border-radius: 50%; pointer-events: none; }
#code { position: absolute; left: 0; top: 0; }
#code i { position: absolute; height: 14px; border-radius: 7px; display: block; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.65) 100%); }

/* ---------- captions ---------- */
.cap { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.hl { font-family: "PADisplay"; font-weight: 900; color: #fff; white-space: nowrap; letter-spacing: -0.5px; }
.hl .w { display: inline-block; white-space: pre; will-change: transform; }
.g { background-image: linear-gradient(90deg, #4FE3E0, #1D62D8); -webkit-background-clip: text; background-clip: text; color: transparent; background-repeat: no-repeat; }
.sub { font-family: "PASemi"; font-weight: 600; color: #4DA3FF; white-space: nowrap; }
.sub .w { display: inline-block; white-space: pre; }

/* ---------- device ---------- */
#devWrap { position: absolute; transform-origin: 50% 50%; }
#devGlow { position: absolute; inset: 0; border-radius: 9%/4.2%; }
#device { position: absolute; left: 0; top: 0; width: 393px; height: 852px; transform-origin: 0 0; border-radius: 55px; overflow: hidden; background: #000; }
#rim { position: absolute; inset: 0; border-radius: 55px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 0 0 3px rgba(0,0,0,.4); pointer-events: none; z-index: 90; }
.screen { position: absolute; inset: 0; color: var(--text); font-size: 17px; letter-spacing: -0.25px; }
.page { position: absolute; left: 0; top: 0; width: 393px; height: 852px; background: var(--bg); overflow: hidden; display: none; color: var(--text); }
.card { background: var(--card); border-radius: 18px; }
.muted { color: var(--muted); }
.lt { position: absolute; left: 16px; top: 101px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.5px; }
.sect { font-size: 20px; line-height: 25px; font-weight: 600; padding-left: 4px; margin: 22px 0 10px; letter-spacing: -0.3px; }
.gbtn { position: absolute; top: 47px; width: 44px; height: 44px; border-radius: 22px; background: var(--gbtn); box-shadow: inset 0 0 0 .6px var(--glassBorder), 0 3px 12px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; color: var(--text); z-index: 20; }
.gbtn.l { left: 17px; } .gbtn.r { right: 16px; }
.edge { position: absolute; left: 0; right: 0; top: 0; height: 112px; background: linear-gradient(var(--bg) 64%, transparent); z-index: 15; pointer-events: none; }
.inlinetitle { position: absolute; top: 58px; left: 70px; right: 70px; text-align: center; font-size: 17px; font-weight: 600; line-height: 22px; z-index: 21; }
svg { display: block; }

/* status bar, tab bar, home indicator */
.sb { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 60; color: var(--text); pointer-events: none; }
.sb .time { position: absolute; left: 0; width: 104px; top: 15px; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
.sb .ri { position: absolute; right: 26px; top: 19px; display: flex; gap: 6px; align-items: center; }
.tabbar { position: absolute; left: 21px; width: 351px; top: 768px; height: 62px; border-radius: 31px; background: var(--glass); box-shadow: inset 0 0 0 .6px var(--glassBorder), 0 10px 30px rgba(0,0,0,.35); z-index: 50; }
.tabpill { position: absolute; top: 4px; height: 54px; border-radius: 27px; background: var(--pill); }
.tab { position: absolute; top: 0; width: 72px; height: 62px; color: var(--text); }
.tab .ti { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); }
.tab .tl { position: absolute; top: 39px; left: 0; right: 0; text-align: center; font-size: 11.5px; font-weight: 600; letter-spacing: -0.1px; }
.tab.sel { color: var(--accent); }
.home { position: absolute; bottom: 8px; left: 129.5px; width: 134px; height: 5px; border-radius: 3px; background: var(--text); z-index: 70; }

/* rows */
.rows .row { display: flex; align-items: center; gap: 14px; padding: 11px 16px; position: relative; }

.rt { flex: 1; min-width: 0; }

.rt .b { font-size: 15px; line-height: 20px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv { font-size: 17px; white-space: nowrap; }
.chev { color: var(--tert); flex: none; }

/* dashboard */
.gauges { padding: 16px; }
.rings { display: flex; }
.gauge { flex: 1; display: flex; flex-direction: column; align-items: center; }
.ringbox { position: relative; width: 78px; height: 78px; }
.ringbox svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ringval { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gt { margin-top: 8px; font-size: 15px; font-weight: 600; line-height: 20px; }
.gd { font-size: 12px; color: var(--muted); line-height: 16px; white-space: nowrap; }
.hdiv { height: .5px; background: var(--sep); margin: 16px 0; }
.net { display: flex; }
.net > div { flex: 1; text-align: center; }
.net .nl { font-size: 12px; color: var(--muted); display: flex; gap: 4px; justify-content: center; align-items: center; line-height: 16px; }

.seg { display: flex; background: var(--field); border-radius: 17px; height: 34px; padding: 2px; position: relative; }
.seg > div { flex: 1; text-align: center; font-size: 13.5px; font-weight: 500; line-height: 30px; position: relative; z-index: 1; white-space: nowrap; }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; border-radius: 15px; background: var(--thumb); box-shadow: 0 2px 6px rgba(0,0,0,.2); z-index: 0; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 5px; }
.facts .fr { display: flex; justify-content: space-between; padding: 11px 16px; font-size: 17px; position: relative; }
.facts .fr + .fr::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }

/* apps */
.chips { display: flex; gap: 8px; margin-top: 12px; }
.chip { font-size: 15px; font-weight: 500; padding: 7px 12px; border-radius: 18px; background: var(--card); white-space: nowrap; }

.chip.on b { color: var(--onAccent); opacity: .85; }
.grid { position: absolute; left: 16px; width: 361px; }

.acard .as { position: absolute; left: 14px; top: 88px; font-size: 12px; line-height: 16px; color: var(--muted); }
.acard .bars { position: absolute; left: 14px; right: 14px; top: 112px; display: flex; gap: 4px; }
.acard .bars i { flex: 1; height: 5px; border-radius: 3px; display: block; }
.spin { position: absolute; }
.ctxbg { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,.18); }
.ctxmenu { position: absolute; z-index: 45; width: 250px; border-radius: 24px; background: rgba(46,46,50,.97); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 0 .6px rgba(255,255,255,.12); overflow: hidden; transform-origin: 20% 0; padding: 6px 0; }

/* terminal list */
.search { position: absolute; left: 16px; right: 16px; top: 156px; height: 44px; border-radius: 22px; background: var(--field); display: flex; align-items: center; gap: 8px; padding-left: 14px; font-size: 17px; color: var(--muted); }

/* terminal session */
.term { position: absolute; left: 8px; right: 8px; top: 106px; font-family: "DejaVu Sans Mono", monospace; font-size: 12px; line-height: 17px; color: var(--termFg); white-space: pre; letter-spacing: 0; }

.term .cur { display: inline-block; width: 7.2px; height: 15px; background: var(--termFg); vertical-align: -3px; }
.acc { position: absolute; left: 0; right: 0; height: 46px; background: #1d1d20; display: flex; gap: 6px; align-items: center; padding: 0 6px; border-top: .5px solid rgba(255,255,255,.08); }
.acc span { height: 32px; min-width: 30px; padding: 0 8px; border-radius: 8px; background: #3a3a3e; color: #fff; font-size: 14px; display: flex; align-items: center; justify-content: center; font-family: "Inter"; }

.key.fn { background: #444447; font-size: 16px; }

/* chat */
.chatview { position: absolute; left: 0; right: 0; top: 104px; bottom: 148px; overflow: hidden; }
.chatin { position: absolute; left: 0; right: 0; top: 0; padding: 8px 16px 0; }
.blk { overflow: visible; position: relative; }
.ubub { margin-left: auto; max-width: 293px; background: var(--accent); color: var(--onAccent); border-radius: 22px; padding: 12px 16px; font-size: 17px; line-height: 23px; width: fit-content; }
.atext { font-size: 17px; line-height: 24px; }
.atext p + p { margin-top: 10px; }
.atext .w { visibility: hidden; }
.mlabel { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
.tcard { border-radius: 18px; background: var(--card); padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.tcard .tt { font-size: 17px; font-weight: 600; line-height: 22px; }
.tcard .ts { font-family: "DejaVu Sans Mono", monospace; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 18px; letter-spacing: 0; }
.li { display: flex; gap: 9px; align-items: flex-start; margin-top: 7px; }
.li svg { flex: none; margin-top: 3px; }
.appr { border-radius: 18px; background: rgba(255,159,10,.13); padding: 14px; }
.appr .h { color: var(--warn); font-size: 15px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.appr .n { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 10px; }
.appr .code { margin-top: 8px; background: var(--termBg); border-radius: 8px; padding: 10px; font-family: "DejaVu Sans Mono", monospace; font-size: 11.5px; line-height: 17px; color: var(--termFg); white-space: pre; letter-spacing: 0; overflow: hidden; }
.appr .btns { display: flex; gap: 10px; margin-top: 12px; }
.appr .btns div { flex: 1; text-align: center; font-size: 17px; font-weight: 600; padding: 14px 0; border-radius: 26px; }
.composer { position: absolute; left: 0; right: 0; top: 716px; height: 42px; z-index: 30; }
.composer .plus { position: absolute; left: 11px; top: 3px; width: 36px; height: 36px; border-radius: 18px; background: var(--gbtn); box-shadow: inset 0 0 0 .6px var(--glassBorder); display: flex; align-items: center; justify-content: center; color: var(--text); }
.composer .fld { position: absolute; left: 57px; right: 61px; top: 0; height: 42px; border-radius: 21px; background: var(--gbtn); box-shadow: inset 0 0 0 .6px var(--glassBorder); font-size: 17px; color: var(--muted); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
.composer .fld small { font-size: 15px; color: var(--muted); }
.composer .send { position: absolute; right: 13px; top: 3px; width: 36px; height: 36px; border-radius: 18px; background: #2d2d31; display: flex; align-items: center; justify-content: center; color: #fff; }

/* watch */
.wbub { background: var(--card); border-radius: 19px; padding: 9px 13px; font-size: 17px; line-height: 23px; position: relative; }
.wbub .sev { font-size: 12px; font-weight: 600; color: var(--warn); display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
.wbub .bar { position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--warn); }
.acts { display: flex; gap: 6px; margin-top: 6px; }
.acts div { font-size: 13px; font-weight: 600; color: var(--accent); background: rgba(61,147,255,.14); padding: 6px 10px; border-radius: 15px; display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.wtime { font-size: 11px; color: var(--muted); margin: 5px 0 0 4px; }
.sysline { text-align: center; font-size: 13px; color: var(--muted); }
.banner { position: absolute; left: 8px; right: 8px; top: 10px; border-radius: 26px; background: rgba(48,48,52,.95); backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%); box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 0 0 .6px rgba(255,255,255,.14); padding: 13px 14px; display: flex; gap: 11px; z-index: 80; color: #fff; }
.banner img { width: 38px; height: 38px; border-radius: 9px; flex: none; }
.banner .bt { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; line-height: 20px; }
.banner .bt span { font-weight: 400; color: rgba(235,235,245,.6); font-size: 14px; }
.banner .bb { font-size: 15px; line-height: 20px; }

/* health */
.score { position: absolute; left: 16px; right: 16px; top: 168px; height: 134px; padding: 16px; display: flex; gap: 18px; align-items: center; }
.score .verdict { font-size: 17px; font-weight: 600; line-height: 22px; }
.score .when { font-size: 13px; color: var(--muted); margin-top: 6px; }
.score .again { margin-top: 8px; display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent); background: rgba(61,147,255,.2); padding: 7px 13px; border-radius: 16px; }
.htile { position: absolute; width: 114px; height: 78px; border-radius: 18px; background: var(--card); padding: 11px 12px; }
.htile .hi { position: absolute; left: 12px; top: 11px; }
.htile .hb { position: absolute; right: 10px; top: 10px; }
.htile .hn { position: absolute; left: 12px; top: 36px; font-size: 15.5px; font-weight: 600; line-height: 19px; }
.htile .hs { position: absolute; left: 12px; top: 56px; font-size: 13px; color: var(--muted); line-height: 16px; white-space: nowrap; }
.needs { position: absolute; left: 16px; right: 16px; top: 528px; overflow: hidden; }
.nrow { display: flex; gap: 14px; align-items: center; padding: 0 14px 0 16px; height: 57px; position: relative; overflow: hidden; }
.nrow + .nrow::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; height: .5px; background: var(--sep); }
.nrow .nt { font-size: 16.5px; font-weight: 600; line-height: 21px; white-space: nowrap; }
.nrow .ns { font-size: 14px; color: var(--muted); line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nrow .btn { margin-left: auto; flex: none; font-size: 15px; font-weight: 600; color: var(--warn); background: rgba(255,159,10,.2); padding: 8px 14px; border-radius: 18px; white-space: nowrap; }

/* taps */
.tap { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 23px; background: rgba(255,255,255,.32); box-shadow: 0 0 0 2px rgba(255,255,255,.55), 0 0 18px rgba(255,255,255,.25); z-index: 95; pointer-events: none; display: none; }

/* intro / outro */
.layer { position: absolute; inset: 0; pointer-events: none; }
.appicon { position: absolute; overflow: hidden; }
.appicon img { width: 100%; height: 100%; display: block; }
.appicon .shine { position: absolute; top: -50%; width: 45%; height: 200%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.38), transparent); transform: rotate(20deg); }
.ring { position: absolute; border-radius: 50%; border: 3px solid rgba(85,148,255,.7); }
.wm { position: absolute; }
.wm { font-family: "PADisplay"; font-weight: 900; color: #fff; white-space: nowrap; text-align: center; letter-spacing: -1px; }
.wm .part { display: inline-block; }
.feat { position: absolute; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.feat div { font-family: "PASemi"; font-weight: 600; color: #e8eef8; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); border-radius: 40px; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.feat div svg { color: #5594FF; }

<body>
<div id="stage">
  <div id="bg">
    <div class="blob" id="blobA"></div>
    <div class="blob" id="blobB"></div>
    <div class="blob" id="blobC"></div>
    <div id="code"></div>
    <div id="vignette"></div>
  </div>
  <div id="caps"></div>
  <div id="devWrap">
    <div id="devGlow"></div>
    <div id="device"><div class="screen" id="screen"></div><div id="rim"></div></div>
  </div>
  <div class="layer" id="intro"></div>
  <div class="layer" id="outro"></div>
  <div class="layer" id="fade" style="background:#000;opacity:0"></div>
</div>
<script>
"use strict";
// ======================================================================
// parameters and layout
// ======================================================================
const Q = new URLSearchParams(location.search);
const LANG = Q.get("lang") === "de" ? "de" : "en";
const ORIENT = Q.get("orient") === "landscape" ? "landscape" : "portrait";
const PORTRAIT = ORIENT === "portrait";
const W = PORTRAIT ? 886 : 1920, H = PORTRAIT ? 1920 : 886;
const FPS = 30, DURATION = 29.5;
const DW = 393, DH = 852;

// where the phone screen and the captions sit
const L = PORTRAIT
  ? { S: 1.66, devX: (W - DW * 1.66) / 2, devY: H - DH * 1.66 - 40,
      cap: { x: 40, y: 0, w: W - 80, h: H - DH * 1.66 - 40 }, hlMax: 100, subSize: 34 }
  : { S: (H - 64) / DH, devX: W - DW * ((H - 64) / DH) - 290, devY: 32,
      cap: { x: 90, y: 0, w: W - DW * ((H - 64) / DH) - 290 - 150, h: H }, hlMax: 112, subSize: 36 };

const stage = document.getElementById("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";
document.documentElement.style.width = W + "px"; document.documentElement.style.height = H + "px";

// scene boundaries (seconds). The soundtrack reads these too.
const SC = {
  intro: [0, 2.5], dash: [2.5, 6.5], apps: [6.5, 9.5], term: [9.5, 12.5], chat: [12.5, 18.5],
  watch: [18.5, 21.5], health: [21.5, 24.5], themes: [24.5, 26.5], outro: [26.5, 29.5],
};

// ======================================================================
// helpers
// ======================================================================
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (t) => 1 - Math.pow(1 - t, 3);
const eOut5 = (t) => 1 - Math.pow(1 - t, 5);
const eIn = (t) => t * t * t;
const eIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eBack = (t) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
// damped spring from 0 to 1, t in seconds
const spring = (t, zeta = 0.62, w = 13) => {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
};
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hex = (h) => { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); };

  const base = [(n >> 16) & 255, (n >> 8) & 255, n & 255];

  return `linear-gradient(135deg, ${rgbs(c[0])}, ${rgbs(c[1])})`;
}

      $(".hb", tl).style.opacity = 1 - k; $(".hb2", tl).style.opacity = k;
      $(".hs", tl).textContent = u > 2.3 ? "OK" : "1 to look at";
    }
  });
  R.rows.forEach((r, i) => {
    const p = eOut(seg(u, 0.45 + i * 0.08, 0.85 + i * 0.08));
    let o = p, h = 57;
    if (NEEDS[i].fix) {
      const btn = $(".btn", r);
      const pr = pressCurve(u, 1.35, 1.43);
      const working = u > 1.43 && u < 1.95, done = u >= 1.95;
      btn.innerHTML = working ? `<svg width="17" height="17" viewBox="0 0 24 24" style="transform:rotate(${u * 520}deg);margin:1px 12px" fill="none" stroke="var(--warn)" stroke-width="3" stroke-linecap="round">${LU.loader}</svg>`
        : done ? `<span style="display:flex;gap:5px;align-items:center">${ic("check", 16, 3)}Fixed</span>` : "Fix it";
      css(btn, { transform: `scale(${1 - 0.06 * pr})`, color: done ? "var(--accent2)" : "var(--warn)", background: done ? "rgba(48,209,88,.18)" : "rgba(255,159,10,.2)" });
      const gone = eIO(seg(u, 2.25, 2.6));
      o *= 1 - gone; h = 57 * (1 - gone);
    }
    css(r, { opacity: o, height: h + "px", transform: `translateY(${(1 - p) * 12}px)` });
  });
}

// ======================================================================
// assemble the screen
// ======================================================================
let D, DA, DB, AP, TL_, TM, CH, WA, HE, PAGES;
const SB = document.createElement("div"), TB = document.createElement("div"), HOME = document.createElement("div"), OVER = document.createElement("div");
function buildScreen() {
  PAGES = {
    dash: page("pg-dash", dashHTML()),
    apps: page("pg-apps", appsHTML()),
    tlist: page("pg-tlist", termListHTML()),
    term: page("pg-term", termHTML()),
    chat: page("pg-chat", chatHTML()),
    watch: page("pg-watch", watchHTML()),
    health: page("pg-health", healthHTML()),
    themeA: page("pg-themeA", dashHTML() + statusBar() + tabBar(0) + `<div class="home"></div>`, "system"),
    themeB: page("pg-themeB", dashHTML() + statusBar() + tabBar(0) + `<div class="home"></div>`, "ocean"),
  };
  SB.innerHTML = statusBar(); screen.appendChild(SB.firstChild);
  TB.innerHTML = tabBar(0); screen.appendChild(TB.firstChild);
  screen.insertAdjacentHTML("beforeend", `<div class="home" id="homeInd"></div>`);
  screen.insertAdjacentHTML("beforeend", `<div class="banner" id="banner" style="display:none"><img src="${ICON_URL}"><div style="flex:1;min-width:0"><div class="bt">PocketADM<span>now</span></div><div class="bb" style="font-weight:600">Watch · The nightly backup didn't run</div><div class="bb">backup-runner stopped at 03:00 — /mnt/backup was not mounted.</div></div></div>`);
  screen.insertAdjacentHTML("beforeend", `<div class="tap" id="tap1"></div><div class="tap" id="tap2"></div>`);
  // measure blocks with every page laid out
  for (const k in PAGES) PAGES[k].style.display = "block";
  D = makeDash(PAGES.dash); DA = makeDash(PAGES.themeA); DB = makeDash(PAGES.themeB);
  AP = makeApps(PAGES.apps); TM = makeTerm(PAGES.term); CH = makeChat(PAGES.chat); WA = makeWatch(PAGES.watch); HE = makeHealth(PAGES.health);
  for (const k in PAGES) PAGES[k].style.display = "none";
}

// ======================================================================
// timeline of the screen
// ======================================================================
// taps: [down, up, x, y]
const TAPS = [
  [6.16, 6.26, TAB_X[1] + 21, 799],
  [7.6, 8.06, 103, 318],
  [8.68, 8.76, 120, 417],
  [9.16, 9.26, TAB_X[2] + 21, 799],
  [9.86, 9.94, 200, 434],
  [17.75, 17.83, 290, 0],   // y filled in from the layout
  [19.42, 19.5, 196, 62],
  [20.5, 20.58, 120, 0],    // y filled in from the layout
  [22.85, 22.93, 334, 0],
];
const PILL = [[0, 0], [6.18, 1], [9.18, 2], [12.3, 3], [19.62, 4], [24.4, 0]];
function pillAt(t) {
  let x = TAB_X[0], st = 0;
  for (let i = 1; i < PILL.length; i++) {
    const [tt, idx] = PILL[i], from = TAB_X[PILL[i - 1][1]], to = TAB_X[idx];
    if (t >= tt) { const p = spring(t - tt, 0.75, 16); x = lerp(from, to, p); st = Math.sin(Math.PI * clamp(p)) * (Math.abs(to - from) > 1 ? 1 : 0); }
  }
  return { x, st };
}
const THEME_SEQ = [["system", "ocean"], ["ocean", "aurora"], ["aurora", "forest"], ["forest", "sunset"], ["sunset", "rose"]];
const TH0 = 24.72, THD = 0.29;
function themeAt(t) {
  if (t < TH0 || t > 27.2) return null;
  const i = Math.min(THEME_SEQ.length - 1, Math.floor((t - TH0) / THD));
  const k = eIO(seg(t, TH0 + i * THD, TH0 + i * THD + THD * 0.92));
  return { from: THEME_SEQ[i][0], to: THEME_SEQ[i][1], k, i };
}
function pageStyle(el, o) {
  el.style.display = o.opacity > 0.001 ? "block" : "none";
  css(el, { opacity: o.opacity, transform: `translate(${o.x || 0}px, ${o.y || 0}px) scale(${o.s || 1})`, filter: o.dim ? `brightness(${1 - o.dim * 0.45})` : "none", zIndex: o.z || 1, clipPath: o.clip || "none" });
}
function renderScreen(t) {
  for (const k in PAGES) PAGES[k].style.display = "none";
  const xin = (B) => eOut(seg(t, B - 0.06, B + 0.26));
  const push = (B) => eOut5(seg(t, B, B + 0.42));
  // dashboard
  if (t < 6.75) { renderDash(D, t - 2.5, 270 * eIO(seg(t, 4.55, 5.75))); pageStyle(PAGES.dash, { opacity: 1, z: 1 }); }
  // apps
  if (t > 6.3 && t < 9.75) { renderApps(AP, t - 6.5); pageStyle(PAGES.apps, { opacity: xin(6.42), y: (1 - xin(6.42)) * 12, z: 2 }); }
  // terminal list, then the session pushed over it
  const sp = push(9.98);
  if (t > 9.3 && t < 10.6) pageStyle(PAGES.tlist, { opacity: xin(9.42), y: (1 - xin(9.42)) * 12, x: -sp * 110, dim: sp, z: 3 });
  if (t > 9.95 && t < 12.75) { renderTerm(TM, t - TERM_START); pageStyle(PAGES.term, { opacity: 1, x: (1 - sp) * DW, z: 4 }); }
  // chat
  const wp = push(19.55);
  if (t > 12.3 && t < 20.1) { renderChat(CH, t - 12.5); pageStyle(PAGES.chat, { opacity: xin(12.42), y: (1 - xin(12.42)) * 12, x: -wp * 110, dim: wp, z: 5 }); }
  // watch
  const hp = push(21.45);
  if (t > 19.5 && t < 21.95) { renderWatch(WA, t - 19.55); pageStyle(PAGES.watch, { opacity: 1, x: (1 - wp) * DW - hp * 110, dim: hp, z: 6 }); }
  // health
  if (t > 21.4 && t < 24.8) { renderHealth(HE, t - 21.5); pageStyle(PAGES.health, { opacity: 1, x: (1 - hp) * DW, z: 7 }); }
  // themes: the dashboard, re-coloured by circles that grow from a tap
  if (t > 24.4) {
    const th = themeAt(t);
    applyTheme(PAGES.themeA, th ? th.from : "system");
    renderDash(DA, 9, 0);
    pageStyle(PAGES.themeA, { opacity: xin(24.5), y: (1 - xin(24.5)) * 12, z: 8 });
    if (th && th.k > 0) {
      applyTheme(PAGES.themeB, th.to);
      renderDash(DB, 9, 0);
      const origins = [[330, 120], [60, 300], [330, 600], [80, 760], [200, 420]];
      const [ox, oy] = origins[th.i % origins.length];
      pageStyle(PAGES.themeB, { opacity: 1, z: 9, clip: `circle(${th.k * 1000}px at ${ox}px ${oy}px)` });
    }
  }
  // status bar, tab bar, home indicator
  const sb = $("#screen > .sb"), tb = $("#screen > .tabbar"), home = $("#homeInd");
  const inThemes = t > 24.75;
  const tabVis = (1 - seg(t, 9.98, 10.18)) + seg(t, 12.35, 12.6);
  css(tb, { opacity: inThemes ? 0 : clamp(tabVis), transform: `translateY(${(1 - clamp(tabVis)) * 30}px)` });
  css(sb, { display: inThemes ? "none" : "block" });
  css(home, { display: inThemes ? "none" : "block", opacity: 0.95 });
  const pl = pillAt(t);
  css($(".tabpill", tb), { left: pl.x - 38 - pl.st * 8 + "px", width: 76 + pl.st * 16 + "px" });
  $$(".tab", tb).forEach((el, i) => el.classList.toggle("sel", Math.abs(TAB_X[i] - pl.x) < 33));
  // notification banner over the chat
  const bn = $("#banner");
  const bIn = spring(t - 18.62, 0.7, 14), bOut = eOut(seg(t, 19.5, 19.8));
  const bvis = t > 18.6 && t < 19.85;
  show(bn, bvis);
  if (bvis) css(bn, { display: "flex", transform: `translateY(${(1 - bIn) * -140}px) scale(${1 - 0.04 * pressCurve(t, 19.42, 19.5) - 0.1 * bOut})`, opacity: 1 - bOut });
  // tap indicators
  const taps = $$(".tap", screen);
  let n = 0;
  for (const [d, u, x, y0] of TAPS) {
    if (t < d - 0.12 || t > u + 0.35) continue;
    const y = y0 || tapY(d);
    const pin = eOut(seg(t, d - 0.12, d)), pout = seg(t, u, u + 0.35);
    const el = taps[n++ % 2];
    css(el, { display: "block", left: x + "px", top: y + "px", opacity: pin * (1 - pout), transform: `scale(${(0.6 + 0.4 * pin) * (1 + 0.5 * pout)})` });
  }
  for (; n < 2; n++) taps[n].style.display = "none";
}
// the y of a tap on something that moves with a scrolled list
function tapY(d) {
  const rect = (el) => { const r = el.getBoundingClientRect(), s = screen.getBoundingClientRect(); return { y: (r.top - s.top) / curScale + (r.height / curScale) / 2 }; };
  if (d === 17.75) return rect(CH.alw).y;
  if (d === 20.5) return rect(WA.act).y;
  if (d === 22.85) return rect($(".btn", HE.rows[3])).y;
  return 400;
}
let curScale = 1;

// ======================================================================
// device placement
// ======================================================================
const devWrap = $("#devWrap"), device = $("#device"), devGlow = $("#devGlow");
function renderDevice(t) {
  const vis = t > 2.05 && t < 26.7;
  show(devWrap, vis);
  if (!vis) return;
  const enter = spring(t - 2.2, 0.78, 7.5);
  const ex = eIn(seg(t, 26.2, 26.66));
  const breathe = 1 + 0.008 * Math.sin((t - 2.5) * 0.9);
  const s = L.S * breathe * (1 - 0.12 * ex) * (0.86 + 0.14 * enter);
  curScale = s;
  const w = DW * s, h = DH * s;
  const cx = L.devX + DW * L.S / 2, cy = L.devY + DH * L.S / 2;
  const y = (1 - enter) * H * 0.75 + ex * 260;
  css(devWrap, { left: cx - w / 2 + "px", top: cy - h / 2 + y + "px", width: w + "px", height: h + "px", opacity: clamp(enter * 3) * (1 - ex), transform: `perspective(2400px) rotateX(${(1 - enter) * 22}deg)`, filter: ex > 0 ? `blur(${ex * 10}px)` : "none" });
  css(device, { transform: `scale(${s})` });
  const th = themeAt(t);
  const gc = th ? mix(th.i === 0 ? hex("1D62D8") : hex(THEMES[th.from].grad[1]), hex(THEMES[th.to].grad[1]), th.k) : hex("1D62D8");
  css(devGlow, { boxShadow: `0 0 ${140 * s / L.S}px ${10 * s / L.S}px ${rgbs(gc, 0.38)}, 0 ${40 * s / L.S}px ${120 * s / L.S}px rgba(0,0,0,.9)`, borderRadius: 55 * s + "px" });
  device.style.borderRadius = "55px";
  renderScreen(t);
}

// ======================================================================
// intro and outro
// ======================================================================
// the name, as the icon draws it: white, then the icon's blue
const WORDMARK = [..."Pocket"].map((c) => `<span class="part">${c}</span>`).join("") + [..."ADM"].map((c) => `<span class="part" style="color:#5594FF">${c}</span>`).join("");
function brandBlock(root, opts) {
  root.innerHTML = `<div class="ring"></div><div class="ring"></div><div class="appicon"><img src="${ICON_URL}"><div class="shine"></div></div><div class="wm">${WORDMARK}</div>` + (opts.tag || "") + (opts.feats || "");
  return { ring: $$(".ring", root), icon: $(".appicon", root), shine: $(".shine", root), wm: $(".wm", root), parts: $$(".wm .part", root) };
}
let IN, OUT;
function buildIntroOutro() {
  const P = PORTRAIT;
  const geo = P ? { icon: 300, cx: W / 2, cy: 690, wmSize: 128, wmY: 880, tagY: 1070 } : { icon: 250, cx: W / 2, cy: 270, wmSize: 104, wmY: 430, tagY: 580 };
  // intro: icon, wordmark, the slogan
  const tagSize = P ? 78 : 70;
  const tagHTML = `<div class="tagwrap" style="position:absolute;left:0;right:0;top:${geo.tagY}px;text-align:center">${TX.intro.map((l) => `<div class="hl" style="font-size:${tagSize}px;line-height:${tagSize * 1.02}px">${wordsHTML(l)}</div>`).join("")}</div>`;
  const ir = $("#intro");
  IN = brandBlock(ir, { tag: tagHTML });
  IN.words = $$(".tagwrap .w:not(.sp)", ir);
  fitGradients(ir);
  // outro: icon, wordmark, line, features
  const fs = P ? 30 : 28;
  const featIcons = [ic("gauge", fs, 2.2), ic("package", fs, 2.2), ic("terminal", fs, 2.4), ic("sparkles", fs, 2.2), ic("eye", fs, 2.2), ic("shield", fs, 2.2)];
  const feats = `<div class="feat" style="left:${P ? 60 : 160}px;right:${P ? 60 : 160}px;top:${geo.tagY + (P ? 90 : 80)}px">${TX.feats.map((f, i) => `<div style="font-size:${fs}px;padding:${fs * 0.45}px ${fs * 0.8}px">${featIcons[i]}${f}</div>`).join("")}</div>`;
  const line = `<div class="oline sub" style="position:absolute;left:0;right:0;top:${geo.tagY}px;text-align:center;font-size:${P ? 36 : 34}px;color:#9DB8E0">${wordsHTML(TX.outro)}</div>`;
  const or = $("#outro");
  OUT = brandBlock(or, { tag: line, feats });
  OUT.words = $$(".oline .w:not(.sp)", or);
  OUT.feats = $$(".feat > div", or);
  for (const B of [IN, OUT]) {
    css(B.icon, { width: geo.icon + "px", height: geo.icon + "px", left: geo.cx - geo.icon / 2 + "px", top: geo.cy - geo.icon / 2 + "px", borderRadius: geo.icon * 0.2237 + "px", boxShadow: "0 30px 90px rgba(29,98,216,.45), 0 0 0 1px rgba(255,255,255,.08)" });
    css(B.wm, { left: "0px", right: "0px", top: geo.wmY + "px", fontSize: geo.wmSize + "px", lineHeight: geo.wmSize * 1.1 + "px" });
    B.ring.forEach((r) => css(r, { width: geo.icon + "px", height: geo.icon + "px", left: geo.cx - geo.icon / 2 + "px", top: geo.cy - geo.icon / 2 + "px" }));
    B.geo = geo;
  }
}
function renderBrand(B, t, t0, opt) {
  const ip = spring(t - t0, 0.55, 10);
  const op = clamp((t - t0) * 4);
  css(B.icon, { opacity: op, transform: `scale(${0.35 + 0.65 * ip}) rotate(${(1 - ip) * -14}deg)`, filter: `blur(${clamp(1 - (t - t0) * 3) * 18}px)` });
  css(B.shine, { left: lerp(-60, 160, eIO(seg(t, t0 + 0.4, t0 + 1.1))) + "%" });
  B.ring.forEach((r, i) => { const p = seg(t, t0 + 0.12 + i * 0.16, t0 + 1.1 + i * 0.16); css(r, { opacity: (1 - p) * 0.7 * (p > 0 ? 1 : 0), transform: `scale(${1 + eOut(p) * 1.4})` }); });
  B.parts.forEach((g, i) => { const p = eOut(seg(t, t0 + opt.wm + i * 0.06, t0 + opt.wm + 0.45 + i * 0.06)); g.style.opacity = p; g.style.transform = `translateY(${(1 - p) * 60}px)`; });
}
function renderIntro(t) {
  const ir = $("#intro");
  const vis = t < 2.75;
  show(ir, vis); if (!vis) return;
  renderBrand(IN, t, 0.12, { wm: 0.55 });
  IN.words.forEach((w, i) => { const p = eOut(seg(t, 1.0 + i * 0.07, 1.5 + i * 0.07)); css(w, { opacity: p, transform: `translateY(${(1 - p) * 40}px)`, filter: `blur(${(1 - p) * 12}px)` }); });
  const out = eIn(seg(t, 1.98, 2.45));
  css(ir, { opacity: 1 - out, transform: `translateY(${-out * 160}px) scale(${1 - 0.08 * out})`, filter: out > 0 ? `blur(${out * 12}px)` : "none" });
}
function renderOutro(t) {
  const or = $("#outro");
  const vis = t > 26.45;
  show(or, vis); if (!vis) return;
  renderBrand(OUT, t, 26.6, { wm: 0.4 });
  OUT.words.forEach((w, i) => { const p = eOut(seg(t, 27.25 + i * 0.05, 27.7 + i * 0.05)); css(w, { opacity: p, transform: `translateY(${(1 - p) * 24}px)` }); });
  OUT.feats.forEach((f, i) => { const p = eOut(seg(t, 27.55 + i * 0.07, 28.0 + i * 0.07)); css(f, { opacity: p, transform: `translateY(${(1 - p) * 30}px) scale(${0.9 + 0.1 * eBack(p)})` }); });
  // a second shine before the end
  if (t > 28.3) css(OUT.shine, { left: lerp(-60, 160, eIO(seg(t, 28.35, 29.0))) + "%" });
}

// ======================================================================
// frame
// ======================================================================
function renderFrame(t) {
  renderBackground(t);
  renderIntro(t);
  renderOutro(t);
  for (const k of ["dash", "apps", "term", "chat", "watch", "health", "themes"]) renderCaption(k, t, SC[k][0], k === "themes" ? SC.themes[1] - 0.12 : SC[k][1]);
  // the theme name in the themes caption follows the circles
  const th = themeAt(t), tn = $(".tname");
  if (tn) { const key = th ? (th.k > 0.5 ? th.to : th.from) : "system"; tn.textContent = THEMES[key].name; tn.style.color = THEMES[key].light ? THEMES[key].grad[0] : THEMES[key].accent; }
  renderDevice(t);
  $("#fade").style.opacity = seg(t, 29.15, 29.5);
}

// ======================================================================
// boot
// ======================================================================
async function boot() {
  await Promise.all(Object.keys(BRAND).map(async (slug) => {
    const r = await fetch(`/App/Resources/Assets.xcassets/Brands/brand-${slug}.imageset/brand-${slug}.svg`);
    BR[slug] = "data:image/svg+xml;base64," + btoa(await r.text());
  }));
  await document.fonts.load('900 100px "PADisplay"'); await document.fonts.load('600 30px "PASemi"');
  await document.fonts.load('400 17px "Inter"'); await document.fonts.load('600 17px "Inter"'); await document.fonts.load('700 34px "Inter"');
  await document.fonts.load('400 12px "DejaVu Sans Mono"'); await document.fonts.load('700 12px "DejaVu Sans Mono"');
  await document.fonts.ready;
  for (const k of ["dash", "apps", "term", "chat", "watch", "health", "themes"]) buildCaption(k, TX[k][0], TX[k][1]);
  const ts = $(".sub", CAPS.themes.el);
  ts.insertAdjacentHTML("beforeend", `<span class="w tname">PocketADM</span>`);
  CAPS.themes.subWords = $$(".w:not(.sp)", ts);
  buildScreen();
  buildIntroOutro();
  await Promise.all($$("img").map((i) => (i.complete ? null : i.decode().catch(() => null))));
  window.TIMELINE = { fps: FPS, duration: DURATION, scenes: SC, taps: TAPS.map((x) => x[0]), bpm: 120, gridOffset: 0.5,
    keys: TERM.map((l, i) => (l.c ? { t0: TERM_T[i].t0 + TERM_START, t1: TERM_T[i].t1 + TERM_START, n: l.c.length } : null)).filter(Boolean),
    themes: { t0: TH0, step: THD, n: THEME_SEQ.length },
    banner: 18.62 };
  window.renderFrame = renderFrame;
  renderFrame(parseFloat(Q.get("t") || "0"));
  window.READY = true;
}
boot();
