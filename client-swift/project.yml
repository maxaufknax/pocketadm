# XcodeGen description — produces PocketADMNative.xcodeproj so no binary project
# file lives in the repo:  xcodegen generate
#
# The native SwiftUI client of PocketADM — since 2.0 *the* App Store app
# (de.maxaufknax.pocketadm), replacing the Capacitor shell in ../client.
#
# The bundle id is not set here but in the generated Config/Build.xcconfig,
# next to the build number: the release workflow writes the App Store id, the
# preview workflow its separate TestFlight-only id (…pocketadm.native). A
# target-level setting in this file would override the xcconfig, so one
# project could not serve both.
name: PocketADMNative
options:
  # No bundleIdPrefix: XcodeGen would invent a target-level bundle id from it,
  # and a target-level setting beats Config/Build.xcconfig.
  deploymentTarget:
    # 17.0 buys Swift Charts' modern API and Observation-era SwiftUI while
    # still covering every phone that can run the Capacitor build.
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  # A real xterm-compatible emulator. The server speaks a PTY byte stream on
  # /ws/terminal, so anything less than a true emulator renders escape
  # sequences as garbage the moment a curses program or a colored prompt shows
  # up. Pinned to a major range: 1.20.0 is what this was written against.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    minVersion: 1.20.0
    maxVersion: 2.0.0

settings:
  base:
    # SWIFT_VERSION only knows language modes (5.0 / 6.0), not point releases.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  PocketADMNative:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
      # Required since 2024 for apps that touch "required reason" APIs
      # (UserDefaults, file timestamps via SwiftTerm). Listed on its own so it
      # lands in the resources phase whatever XcodeGen infers from the suffix.
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    # Push notifications (the watch's messages, the assistant waiting for an
    # OK). The release workflow enables the capability on the app id first
    # (tools/asc_push.py) and removes this block when it cannot — the app then
    # falls back to local notifications instead of failing to sign.
    # push-entitlement-begin
    entitlements:
      path: App/PocketADM.entitlements
      properties:
        aps-environment: production
    # push-entitlement-end
    # Carries CURRENT_PROJECT_VERSION and PRODUCT_BUNDLE_IDENTIFIER, written by
    # the Codemagic workflow (and by tools/bootstrap-config.sh for local
    # generation). Kept out of the repo so the build number is never a
    # committed, stale value.
    #
    # Must be `configFiles`. Written under `settings.configs.<name>.xcconfig` —
    # which looks right — XcodeGen silently creates a build setting literally
    # named "xcconfig" instead, the file is never attached, CFBundleVersion
    # stays 1, and the second upload is rejected for a duplicate build number.
    configFiles:
      Debug: Config/Build.xcconfig
      Release: Config/Build.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PocketADM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        UILaunchScreen:
          UIColorName: LaunchBackground
        # All four orientations on purpose. Since iOS 26 even iPhone-only apps
        # run in freely resizable windows on iPad and Mac, and Apple's upload
        # check rejects a restricted list with error 90474. A phone with Face ID
        # never uses upside-down anyway, and the terminal is genuinely better
        # in landscape.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Background refresh: new watch messages and a waiting assistant as
        # local notifications when real push is not available.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - de.maxaufknax.pocketadm.refresh
        # Saves the export-compliance question on every upload: the app only
        # ever uses the system's own HTTPS/TLS.
        ITSAppUsesNonExemptEncryption: false
        # Pairing is the primary onboarding path and it scans a QR code.
        NSCameraUsageDescription: >-
          PocketADM uses the camera to scan the pairing QR code your server
          shows — at the end of its installer, or on a device that is already
          signed in.
        # A self-hosted server usually lives on the LAN. Without this, iOS
        # silently drops the very first request to 192.168.x.x / *.local and
        # the Connect screen just says "cannot reach server".
        NSLocalNetworkUsageDescription: >-
          PocketADM connects to your own server, which is often on the same
          local network as this device.
        NSAppTransportSecurity:
          # PocketADM is self-hosted: older installs answer on plain
          # http://192.168.1.10:8090 inside a LAN or a VPN (Tailscale, WireGuard),
          # and ATS cannot know those are the user's own machines. New installs
          # are HTTPS from the start, with the server's own certificate pinned
          # through the pairing QR (TrustStore.swift) — that trust decision
          # replaces ATS's CA check rather than skipping it.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        # PRODUCT_BUNDLE_IDENTIFIER comes from Config/Build.xcconfig (see top).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
